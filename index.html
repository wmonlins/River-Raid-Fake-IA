<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Raid Rápido</title>
<style>
:root{--bg:#f4f4f0;--fg:#1b1b1b;--btn:#dcdcd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--btn:#2b2f35}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eee;--btn:#2b2f35}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}
body{padding:10px}
canvas{width:min(100%,360px);height:auto;border-radius:8px;display:block;margin:0 auto;touch-action:none}
.pad{display:flex;justify-content:center;gap:8px;margin:10px auto;flex-wrap:wrap;max-width:360px}
.pad button{flex:1;min-width:60px;padding:16px 0;font-size:20px;border:0;border-radius:10px;background:var(--btn);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
.pad .f{flex:2;background:#d84315;color:#fff;font-weight:700}
small{opacity:.7}
#nameBox{display:flex;gap:8px;max-width:360px;margin:8px auto}#nameBox[hidden]{display:none}#nameBox input{flex:2;min-width:0;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--btn);background:var(--bg);color:var(--fg)}#nameBox button{flex:1.4;padding:12px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-weight:700}
#rank{max-width:360px;margin:8px auto;text-align:left;background:var(--btn);border-radius:10px;padding:10px 14px;font-size:14px}#rank h3{margin:0 0 6px;font-size:14px}#rank div{display:flex;justify-content:space-between}
#coopBox{max-width:360px;margin:8px auto;background:var(--btn);border-radius:10px;padding:12px;text-align:left}#coopBox[hidden]{display:none}#coopBox div{margin:6px 0}#coopBox input{width:90px;padding:10px;font-size:16px;text-transform:uppercase;border-radius:8px;border:1px solid var(--btn);background:var(--bg);color:var(--fg)}#coopBox button{padding:10px 12px;border:0;border-radius:8px;background:#1565c0;color:#fff;font-weight:700}#coopStatus{font-size:13px}
</style></head><body>
<canvas id="c" width="360" height="540"></canvas>
<div class="pad">
<button data-k="left" aria-label="Mover para a esquerda">◀</button><button data-k="up" aria-label="Acelerar">▲</button><button data-k="down" aria-label="Frear">▼</button><button data-k="right" aria-label="Mover para a direita">▶</button><button class="f" data-k="fire" aria-label="Atirar">FOGO</button><button id="pause" type="button" aria-label="Pausar jogo">PAUSAR</button>
<button id="mute" type="button" aria-label="Ligar ou desligar o som">SOM: ON</button>
<button id="bot" type="button" aria-label="Deixar o robô jogar">ROBÔ: OFF</button>
<button id="coop" type="button">CO-OP</button>
<button id="restart" type="button" hidden>RECOMEÇAR</button>
</div>
<div id="coopBox" hidden><b>Co-op online</b>
<div><button id="coopCreate" type="button">CRIAR SALA</button></div>
<div><input id="coopCode" maxlength="4" placeholder="Código" autocomplete="off"> <button id="coopJoin" type="button">ENTRAR</button></div>
<div id="coopStatus"></div><div><button id="coopLeave" type="button">SAIR DO CO-OP</button></div></div>
<div id="nameBox" hidden><input id="nameIn" maxlength="10" placeholder="Seu nome" autocomplete="off"><button id="nameSave" type="button">SALVAR NO RANKING</button></div>
<div id="rank"></div>
<small>Setas ou WASD para mover · Espaço atira · S dá escudo de um impacto · P pausa · M som · R recomeça após perder</small>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=540,RH=6,N=Math.ceil(H/RH)+2,BEST_KEY='riverRaidRapidoBest';
const environments=[
{name:'TROPICAL',water:'#1976d2',bank:'#2e7d32'},
{name:'NOITE',water:'#102447',bank:'#172b24',night:true},
{name:'NEVE',water:'#8ed8ef',bank:'#e9f5f7',snow:true},
{name:'CLIMA SECO',water:'#438f91',bank:'#b48a4f',dust:true}
];
let rows,off,ctr,wid,wt,p,ens,bs,enemyShots,islands,islandSpawn,fx,terrain,terrainSpawn,boss,bossIntro,bossResult,shield,score,fuel,over,paused,level,distance,nextBossAt,weapon,cd,t,spawnT,best=loadBest();
const keys={},keyboardKeys={},pointerKeys=new Map();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function environment(){return environments[(level-1)%environments.length]}
function loadBest(){try{const saved=localStorage.getItem(BEST_KEY);if(saved===null)return 0;const value=Number(saved);if(Number.isFinite(value)&&value>=0)return value;console.warn('Recorde salvo inválido; iniciando com recorde zero.');return 0}catch(error){console.warn('Não foi possível carregar o recorde salvo.',error);return 0}}
function saveBest(){try{localStorage.setItem(BEST_KEY,String(best))}catch(error){console.warn('Não foi possível salvar o recorde.',error)}}
function updateKey(k){keys[k]=!!keyboardKeys[k]||[...pointerKeys.values()].includes(k)}
function clearControls(){for(const k in keys)keys[k]=0;for(const k in keyboardKeys)keyboardKeys[k]=0;pointerKeys.clear()}
function setPaused(value){if(!started||over||coop)return;paused=value;clearControls();const button=document.getElementById('pause');button.textContent=paused?'RETOMAR':'PAUSAR';button.setAttribute('aria-label',paused?'Retomar jogo':'Pausar jogo')}
function togglePause(){if(started&&!over)setPaused(!paused)}
function burst(x,y,color,count=12){for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,speed=1+Math.random()*3;fx.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:18+Math.random()*14,maxLife:32,color,size:2+Math.random()*3})}}
function newRow(){ctr+=(RR()-.5)*7;wt=clamp(wt+(RR()-.5)*6,180,300);wid+=(wt-wid)*.05;const h=wid/2;ctr=clamp(ctr,h+14,W-h-14);return{c:ctr,w:wid}}
function newTerrain(y){const size=7+Math.random()*6;return{side:Math.random()<.5?-1:1,type:Math.random()<.43?'tree':Math.random()<.72?'bush':Math.random()<.9?'rock':'ridge',size,depth:size*2.2+Math.random()*34,y,seed:Math.random()}}
function newIsland(){const r=rowAt(-20),rx=15+RI()*21,ry=11+RI()*16,offsetLimit=Math.max(0,r.w/2-rx-22),points=5+Math.floor(RI()*6),shape=Array.from({length:points},()=>.72+RI()*.48);return{x:r.c+(RI()*2-1)*offsetLimit,y:-24,rx,ry,shape}}
function reset(fromNet){if(coop&&cn&&cn.sync&&!fromNet)netEv({k:'restart'});if(cn)cn.rt=performance.now();clearControls();if(coop&&cn){RR=mkRng(cn.seed*7+1);RS=mkRng(cn.seed*23+4);RI=mkRng(cn.seed*17+3)}else{RR=RS=RI=Math.random}eid=0;gone.clear();gb=[];down=false;downT=0;ctr=W/2;wid=270;wt=270;rows=[];for(let i=0;i<N;i++)rows.push(newRow());off=0;p={x:W/2,y:440};ens=[];bs=[];enemyShots=[];islands=[];islandSpawn=85;fx=[];terrain=Array.from({length:34},(_,i)=>newTerrain(-16+i*17));terrainSpawn=25;boss=null;bossIntro=0;bossResult=null;shield=false;score=0;fuel=100;over=false;paused=false;level=1;distance=0;nextBossAt=1800;weapon='normal';cd=0;t=0;spawnT=40;hitCd=0;pendingScore=0;document.getElementById('nameBox').hidden=true;const button=document.getElementById('pause');button.textContent='PAUSAR';button.setAttribute('aria-label','Pausar jogo');document.getElementById('restart').hidden=true}
function rowAt(y){return rows[clamp(Math.floor((y+RH-off)/RH),0,N-1)]}
function die(){if(coop&&cn&&cn.sync&&!over){if(!down){down=true;downT=420;burst(p.x,p.y,'#ff7043',20);playS('big');p.y=-9999}if(peerDown())realDie();return}realDie()}
function realDie(){if(!over){burst(p.x,p.y,'#ff7043',20);playS('big');playS('over')}over=true;paused=false;weapon='normal';shield=false;bs=[];enemyShots=[];clearControls();document.getElementById('restart').hidden=false;if(!botOn&&!coop){if(score>best){best=score;saveBest()}checkRank()}}
function createBoss(){const r=rowAt(-20),variant=(level-1)%environments.length;boss={variant,x:r.c,y:-42,vx:1.5+level*.12,hp:12+level*3,maxHp:12+level*3,shotCd:65,phase:0};bossIntro=150;playS('bossAlarm');bossResult=null}
function defeatBoss(){playS('bossDie');burst(boss.x,boss.y,['#ffca28','#ab47bc','#80deea','#ff8a50'][boss.variant],32);score+=500+level*100;fuel=Math.min(100,fuel+20);boss=null;bossIntro=0;bossResult={text:'CHEFE DERROTADO! +'+(500+level*100)+' PONTOS',timer:150};level++;nextBossAt+=1800;spawnT=30}
function step(){
if(over||paused||!started)return;t++;if(bossIntro>0)bossIntro--;if(bossResult&&--bossResult.timer<=0)bossResult=null;
let sp=2.2;if(!coop){if(keys.up)sp=3.6;if(keys.down)sp=1.2}
sp+=Math.min(1.35,(level-1)*.15);curSp=sp;
distance+=sp;if(!boss&&distance>=nextBossAt)createBoss();
if(down){p.y=-9999;p.x=rows[0].c;hitCd=99;cd=99;fuel=Math.max(fuel,30);if(--downT<=0){down=false;p.y=440;p.x=rowAt(440).c;fuel=Math.max(fuel,50);hitCd=140;shield=false;weapon='normal'}}
if(keys.left)p.x-=3.2;if(keys.right)p.x+=3.2;
off+=sp;while(off>=RH){off-=RH;rows.unshift(newRow());rows.pop()}
for(const feature of terrain)feature.y+=sp*.28;terrain=terrain.filter(feature=>feature.y<H+25);if(--terrainSpawn<=0){terrain.push(newTerrain(-18));terrainSpawn=25+Math.random()*18}
for(const island of islands)island.y+=sp;islands=islands.filter(island=>island.y<H+island.ry);if(!boss&&--islandSpawn<=0){islands.push(newIsland());islandSpawn=105+RI()*85}
fuel-=0.04*(sp/2.2);if(fuel<=0)return die();
if(hitCd>0)hitCd--;
const r=rowAt(p.y),lo=r.c-r.w/2+11,hi=r.c+r.w/2-11;if(p.x<lo||p.x>hi){p.x=clamp(p.x,lo,hi);if(hitCd<=0){hitCd=75;fuel-=40;bossResult={text:'BATEU! -40% COMBUSTÍVEL',timer:70};burst(p.x,p.y,'#ff7043',14);playS('boom');if(fuel<=0)return die()}}
for(const island of islands){const dx=(p.x-island.x)/(island.rx+10),dy=(p.y-island.y)/(island.ry+8);if(dx*dx+dy*dy<1){if(shield){shield=false;island.dead=true;burst(p.x,p.y,'#80deea',20);playS('shieldHit')}else if(hitCd<=0){hitCd=75;island.dead=true;fuel-=40;bossResult={text:'BATEU! -40% COMBUSTÍVEL',timer:70};burst(p.x,p.y,'#ff7043',16);playS('boom');if(fuel<=0)return die()}}}islands=islands.filter(island=>!island.dead);
if(!boss&&--spawnT<=0){spawnT=Math.max(22,45+RS()*40-(level-1)*2);const q=rows[0],k=RS();
const type=k<.12?'fuel':k<.19?'double':k<.25?'triple':k<.30?'missile':k<.35?'shield':RS()<.5?'ship':'heli';
const shooter=['ship','heli'].includes(type)&&RS()<Math.min(.48,.2+(level-1)*.035);
ens.push({id:++eid,type,x:q.c+(RS()-.5)*(q.w-60),y:-20,vx:['fuel','double','triple','missile','shield'].includes(type)?0:(type=='ship'?.8:1.4)*(RS()<.5?-1:1),shooter,shotCd:70+RS()*60});if(gone.has(eid))ens[ens.length-1].dead=1}
cd--;if(keys.fire&&cd<=0){if(weapon=='double')for(const dx of [-6,6])bs.push({x:p.x+dx,y:p.y-14,type:'bullet'});else if(weapon=='triple')for(const dx of [-9,0,9])bs.push({x:p.x+dx,y:p.y-14,type:'bullet'});else bs.push({x:p.x,y:p.y-14,type:weapon=='missile'?'missile':'bullet'});cd=weapon=='missile'?24:14;playS(weapon=='double'?'shot2':weapon=='triple'?'shot3':weapon=='missile'?'missile':'shot1')}
for(const e of ens){e.y+=sp;if(e.vx){e.x+=e.vx;const q=rowAt(e.y),lo=q.c-q.w/2+16,hi=q.c+q.w/2-16;if(e.x<lo||e.x>hi){e.vx*=-1;e.x=clamp(e.x,lo,hi)}}
if(e.shooter&&e.y>0&&e.y<(coop?440:p.y)-60&&--e.shotCd<=0){const T=coop?{x:e.x+(RS()-.5)*120,y:440}:p,dx=T.x-e.x,dy=T.y-e.y,len=Math.hypot(dx,dy)||1,speed=2.5+level*.12;enemyShots.push({x:e.x,y:e.y+8,vx:dx/len*speed,vy:dy/len*speed});playS('enemyShot');e.shotCd= Math.max(42,125-level*7)+RS()*35}
if(Math.abs(e.x-p.x)<18&&Math.abs(e.y-p.y)<16){if(e.type=='fuel'){fuel=Math.min(100,fuel+18);e.dead=1;burst(e.x,e.y,'#ffee58',14);playS('fuel');evPick(e)}else if(['double','triple','missile'].includes(e.type)){weapon=e.type;e.dead=1;burst(e.x,e.y,e.type=='missile'?'#ff7043':'#80deea',16);playS('power');evPick(e)}else if(e.type=='shield'){shield=true;e.dead=1;score+=100;burst(e.x,e.y,'#80deea',18);playS('shield');evPick(e)}else if(shield){shield=false;e.dead=1;burst(e.x,e.y,'#80deea',24);playS('shieldHit');evPick(e)}else return die()}}
if(boss){const r=rowAt(boss.y);boss.y=Math.min(82,boss.y+1.2);boss.phase+=.035+level*.003;boss.x+=boss.vx;if(boss.x<r.c-r.w/2+34||boss.x>r.c+r.w/2-34)boss.vx*=-1;if(--boss.shotCd<=0){const T=coop?{x:boss.x+Math.sin(boss.phase*5)*90,y:440}:p,dx=T.x-boss.x,dy=T.y-boss.y,len=Math.hypot(dx,dy)||1,speed=2.1+level*.1;const spread=boss.variant===1?[-.22,0,.22]:boss.variant===2?[-.12,.12]:[0];playS('bossShot');for(const angle of spread){const cos=Math.cos(angle),sin=Math.sin(angle);enemyShots.push({x:boss.x,y:boss.y+18,vx:(dx/len*cos-dy/len*sin)*speed,vy:(dx/len*sin+dy/len*cos)*speed})}boss.shotCd=Math.max(30,72-level*3)}}
for(const shot of enemyShots){shot.x+=shot.vx;shot.y+=shot.vy;if(Math.abs(shot.x-p.x)<13&&Math.abs(shot.y-p.y)<15){if(shield){shield=false;shot.dead=1;burst(shot.x,shot.y,'#80deea',24);playS('shieldHit')}else{burst(shot.x,shot.y,'#ff5252',8);return die()}}}
enemyShots=enemyShots.filter(shot=>!shot.dead&&shot.y<H+12&&shot.x>-12&&shot.x<W+12);
for(const b of bs){if(b.type=='missile'){const target=boss||ens.find(e=>!e.dead&&['ship','heli'].includes(e.type));if(target){const dx=target.x-b.x,dy=target.y-b.y,len=Math.hypot(dx,dy)||1;b.x+=dx/len*7;b.y+=dy/len*7}else b.y-=7}else b.y-=8;if(boss&&Math.abs(b.x-boss.x)<30&&Math.abs(b.y-boss.y)<20){boss.hp-=b.type=='missile'?3:1;if(coop)netEv({k:'boss',d:b.type=='missile'?3:1});b.dead=1;burst(b.x,b.y,'#fff176',4);playS('bossHit');if(boss.hp<=0)defeatBoss();continue}for(const e of ens){if(!e.dead&&['ship','heli','fuel'].includes(e.type)&&Math.abs(b.x-e.x)<(b.type=='missile'?17:14)&&Math.abs(b.y-e.y)<(b.type=='missile'?17:14)){e.dead=1;b.dead=1;if(e.type=='fuel'){fuel-=5;bossResult={text:'ATIROU NO TANQUE! -5%',timer:60}}else score+={ship:30,heli:60}[e.type];if(coop)netEv({k:'kill',id:e.id,pts:e.type=='fuel'?0:{ship:30,heli:60}[e.type]});burst(e.x,e.y,e.type=='heli'?'#ef5350':'#ffca28');playS('boom');break}}}
if(coop&&cn&&cn.peer){if(cn.peer.f&&cn.peer.a!==0&&--cn.pcd<=0){gb.push({x:cn.px==null?cn.peer.x:cn.px,y:426});cn.pcd=14}for(const b of gb)b.y-=8;gb=gb.filter(b=>b.y>-10)}
ens=ens.filter(e=>!e.dead&&e.y<H+20);bs=bs.filter(b=>!b.dead&&b.y>-10);for(const particle of fx){particle.x+=particle.vx;particle.y+=particle.vy;particle.vx*=.97;particle.vy*=.97;particle.life--}fx=fx.filter(particle=>particle.life>0)}
function draw(){
const env=environment();g.fillStyle=env.water;g.fillRect(0,0,W,H);g.fillStyle=env.bank;
for(let i=0;i<N;i++){const y=i*RH-RH+off,r=rows[i];g.fillRect(0,y,r.c-r.w/2,RH+1);g.fillRect(r.c+r.w/2,y,W,RH+1)}
g.save();g.beginPath();for(let y=0;y<=H;y+=RH){const r=rowAt(y);if(y===0)g.moveTo(r.c-r.w/2,y);else g.lineTo(r.c-r.w/2,y)}for(let y=H;y>=0;y-=RH){const r=rowAt(y);g.lineTo(r.c+r.w/2,y)}g.closePath();g.clip();g.strokeStyle=env.night?'rgba(187,210,255,.14)':env.snow?'rgba(255,255,255,.32)':'rgba(210,245,255,.2)';g.lineWidth=1;for(let i=0;i<12;i++){const y=(i*49+t*.42)%H,x=(i*83+Math.sin(t*.012+i)*8+W)%W,r=rowAt(y);if(x<r.c-r.w/2||x>r.c+r.w/2)continue;g.beginPath();g.moveTo(x-5,y);g.quadraticCurveTo(x,y-1.4,x+6,y);g.stroke()}g.restore();
if(env.night){g.fillStyle='rgba(5,12,32,.36)';g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,220,.8)';for(let i=0;i<24;i++){const x=(i*97+31)%W,y=(i*67+19)%210;g.fillRect(x,y,2,2)}}
for(const item of terrain){const r=rowAt(item.y),side=item.side,edge=r.c+side*r.w/2,maxDepth=side<0?edge-4:W-edge-4,size=Math.min(item.size,maxDepth*.32),depth=Math.min(item.depth,maxDepth-size*2);if(size<4||depth<2)continue;const x=edge+side*depth,y=item.y;
if(item.type==='ridge'){g.strokeStyle=env.snow?'rgba(255,255,255,.36)':env.night?'rgba(143,166,138,.2)':env.dust?'rgba(91,62,38,.26)':'rgba(12,65,28,.28)';g.lineWidth=1;g.beginPath();g.moveTo(side<0?0:x,y+3);g.quadraticCurveTo(x-side*size*1.5,y-size*.4,side<0?x:W,y+2);g.stroke();continue}
if(item.type==='rock'){g.fillStyle=env.snow?'#8296a3':env.night?'#34434a':env.dust?'#806447':'#536b3d';g.beginPath();g.ellipse(x,y+Math.sin(item.seed*8)*2,size,size*.68,-.15,0,Math.PI*2);g.fill();g.fillStyle=env.snow?'#dce8ed':'rgba(255,255,255,.2)';g.beginPath();g.ellipse(x-side*size*.22,y-2,size*.38,size*.2,-.3,0,Math.PI*2);g.fill()}
else if(item.type==='bush'){g.fillStyle=env.snow?'#6e9b87':env.night?'#244c3a':env.dust?'#65733b':'#176b31';for(const [d,dy,radius] of [[size*.48,2,size*.48],[size*1.12,0,size*.63],[size*1.68,3,size*.42]]){g.beginPath();g.arc(x+side*d,y+dy,radius,0,Math.PI*2);g.fill()}g.fillStyle=env.snow?'#f4fbff':'rgba(150,210,92,.55)';g.beginPath();g.arc(x+side*size*1.14,y-size*.24,size*.22,0,Math.PI*2);g.fill()}

function setPath(root,path,val){const ks=path.split('/').filter(Boolean);if(!ks.length)return val;root=root&&typeof root=='object'?root:{};let o=root;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!='object')o[ks[i]]={};o=o[ks[i]]}if(val===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=val;return root}
function onEv(e){
if(e.k=='kill'||e.k=='pick'){const en=ens.find(x=>x.id===e.id);if(en){if(!en.dead){en.dead=1;burst(en.x,en.y,'#ffca28',10)}}else gone.add(e.id);
if(e.k=='kill')score+=e.pts||0;
if(e.k=='pick'){if(e.type=='fuel')fuel=Math.min(100,fuel+18);if(e.type=='shield')score+=100}}
else if(e.k=='boss'&&boss){boss.hp-=e.d;burst(boss.x,boss.y,'#fff176',4);if(boss.hp<=0)defeatBoss()}
else if(e.k=='restart'){reset(true);started=true}}
function onRoom(){const R=cn.room;if(!R)return;
const ev=R.ev||{};for(const k in ev){if(cn.seen.has(k))continue;cn.seen.add(k);if(cn.primed&&ev[k]&&ev[k].r!==cn.role)onEv(ev[k])}cn.primed=true;
const pr=R[cn.role=='host'?'guest':'host'];
if(pr&&typeof pr.t=='number'){cn.peer=pr;if(cn.role=='guest'){cn.hT=pr.t;cn.hAt=performance.now()}}
if(cn.role=='host'&&!cn.started&&R.guest)startCoop();
if(cn.sync&&down&&!over&&peerDown())realDie();
if(cn.sync&&cn.peer&&cn.peer.ov===1&&!over&&performance.now()-cn.rt>1500)realDie()}
function openStream(){const es=new EventSource(cn.base+'.json');cn.es=es;
const msg=(ev,patch)=>{let m;try{m=JSON.parse(ev.data)}catch(x){return}if(!m||!cn)return;
if(patch){const b=m.path==='/'?'':m.path;for(const k in m.data)cn.room=setPath(cn.room,b+'/'+k,m.data[k])}else cn.room=setPath(cn.room,m.path,m.data);onRoom()};
es.addEventListener('put',e=>msg(e,false));es.addEventListener('patch',e=>msg(e,true));
es.onerror=()=>cstat('Conexão instável com o servidor...')}
function newCn(role,code,seed){return{role,code,base:FB+'/'+code,seed,seen:new Set(),primed:false,room:null,peer:null,sync:false,started:false,px:null,pcd:0,rt:0}}
async function coopCreate(){if(cn)return;const code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join(''),seed=Math.floor(Math.random()*1e6)+1;
cn=newCn('host',code,seed);
try{const r=await fetch(cn.base+'.json',{method:'PUT',body:JSON.stringify({seed,host:{t:0},created:Date.now()})});if(!r.ok)throw 0}catch(e){cstat('Co-op só funciona no link do Netlify, com internet livre.');cn=null;return}
openStream();cstat('Sala '+code+' criada! Passe o código pro seu amigo e aguarde...')}
async function coopJoin(code){if(cn)return;code=String(code).trim().toUpperCase();if(!code)return;let room;
try{const r=await fetch(FB+'/'+code+'.json');room=await r.json()}catch(e){cstat('Co-op só funciona no link do Netlify, com internet livre.');return}
if(!room||!room.seed){cstat('Sala não encontrada.');return}
cn=newCn('guest',code,room.seed);
try{await fetch(cn.base+'/guest.json',{method:'PUT',body:JSON.stringify({joined:1,t:0})})}catch(e){cstat('Não consegui entrar na sala.');cn=null;return}
openStream();startCoop()}
function startCoop(){if(cn.started)return;cn.started=true;coop=true;gb=[];reset(true);started=true;cn.sync=true;cstat('Co-op ativo! Sala '+cn.code+' · você é o '+(cn.role=='host'?'Jogador 1':'Jogador 2'))}
function coopLeave(){if(cn&&cn.es)cn.es.close();cn=null;coop=false;down=false;reset(true);cstat('')}
function drawCoop(){if(!coop||!cn)return;
for(const b of gb){g.fillStyle='#80deea';g.fillRect(b.x-1,b.y-5,3,10)}
const q=cn.peer;if(q&&q.a!==0){cn.px=cn.px==null?q.x:cn.px+(q.x-cn.px)*.25;const x=cn.px,y=440;
if(q.s){g.strokeStyle='rgba(128,222,234,.8)';g.lineWidth=3;g.beginPath();g.arc(x,y,21,0,Math.PI*2);g.stroke()}
g.fillStyle='#4dd0e1';g.beginPath();g.moveTo(x,y-14);g.lineTo(x+4,y+8);g.lineTo(x-4,y+8);g.fill();g.fillRect(x-12,y-1,24,5);g.fillRect(x-6,y+6,12,3);
g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.fillText('AMIGO '+q.fu+'%',x,y+22)}
if(down){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,H/2-28,W,56);g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('VOCÊ CAIU! Volta em '+Math.ceil(downT/60)+'s',W/2,H/2+6)}}
function coopInit(){const $=id=>document.getElementById(id);
$('coop').addEventListener('click',()=>{$('coopBox').hidden=!$('coopBox').hidden});
$('coopCreate').addEventListener('click',coopCreate);$('coopJoin').addEventListener('click',()=>coopJoin($('coopCode').value));$('coopLeave').addEventListener('click',coopLeave);
setInterval(()=>{if(!coop||!cn||!cn.sync)return;cput('/'+cn.role,{x:Math.round(p.x),t,f:keys.fire&&!down?1:0,w:weapon,s:shield?1:0,a:down?0:1,fu:Math.round(fuel),ov:over?1:0})},66)}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(50,n-last);last=n;if(coop&&cn&&cn.role=='guest'&&cn.hT!=null){const lag=cn.hT+(performance.now()-cn.hAt)/16.67-t;if((cn.fc=(cn.fc|0)+1)%3==0&&Math.abs(lag)>3)acc+=lag>0?16.67:-16.67}while(acc>=16.67){if(botOn){if(over){if(++botWait>150){reset();started=true;botWait=0}}else if(started&&!paused)botDecide()}step();acc-=16.67}draw();audioTick();requestAnimationFrame(loop)}
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'fire'};
let started=false;window.focus();
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT'){if(e.code=='Enter'||e.code=='NumpadEnter')saveName();return}audioInit();if(e.code=='KeyM'){e.preventDefault();if(!e.repeat)setMute(!muted);return}if(e.code=='KeyR'){e.preventDefault();if(over&&!e.repeat)reset();return}if(e.code=='KeyP'){e.preventDefault();if(!e.repeat)togglePause();return}const k=map[e.code];if(k){e.preventDefault();if(over)return;if(!started)started=true;keyboardKeys[k]=1;updateKey(k)}});
addEventListener('keyup',e=>{const k=map[e.code];if(k){keyboardKeys[k]=0;updateKey(k)}});
addEventListener('blur',()=>{clearControls();if(started&&!over)setPaused(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearControls();if(started&&!over)setPaused(true)}});
addEventListener('pointerdown',()=>window.focus());['pointerdown','click','touchend'].forEach(ev=>addEventListener(ev,audioInit));
cv.addEventListener('pointerdown',()=>{if(!started)started=true});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();if(over)return;if(!started)started=true;pointerKeys.set(e.pointerId,k);updateKey(k);b.setPointerCapture(e.pointerId)});
const release=e=>{const held=pointerKeys.get(e.pointerId);if(held){pointerKeys.delete(e.pointerId);updateKey(held)}};
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release))});
document.getElementById('pause').addEventListener('click',togglePause);
document.getElementById('restart').addEventListener('click',()=>{reset();started=true});
document.getElementById('mute').addEventListener('click',()=>setMute(!muted));document.getElementById('nameSave').addEventListener('click',saveName);document.getElementById('bot').addEventListener('click',()=>setBot(!botOn));renderRank();loadGlobal();
coopInit();reset();requestAnimationFrame(loop);
</script></body></html>
